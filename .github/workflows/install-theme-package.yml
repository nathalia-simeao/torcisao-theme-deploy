name: Install sanitized Torcisao theme package

on:
  push:
    branches: [main]
    paths:
      - torcisao-theme-sanitized.zip

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify package checksum
        run: echo "8c8986ad51a92df7293da6648513946c6941437fdb1ee0350fba72fd72a94240  torcisao-theme-sanitized.zip" | sha256sum -c -

      - name: Extract public theme
        run: |
          rm -rf theme
          mkdir -p theme
          unzip -q torcisao-theme-sanitized.zip -d theme
          rm -f theme/inc/torcisao-application-ai.php

      - name: Remove legacy Theo include from public theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('theme/functions.php')
          s = p.read_text(encoding='utf-8')
          legacy = "\n$ai_file = get_template_directory().'/inc/torcisao-application-ai.php';\nif (file_exists($ai_file)) require_once $ai_file;\n"
          s = s.replace(legacy, "\n")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Safety checks
        run: |
          test -f theme/style.css
          test -f theme/functions.php
          test -f theme/single.php
          test -f theme/assets/torcisao-blog-single-v41.css
          test -f theme/assets/torcisao-product-assistant-v13.js
          test ! -f theme/inc/torcisao-application-ai.php
          if grep -RniE 'TORCISAO_HUBSPOT_ACCESS_TOKEN|TORCISAO_OPENAI_API_KEY|OPENAI_API_KEY|hubapi\.com/contacts|api\.openai\.com/v1/responses' theme --include='*.php' --include='*.js' --include='*.css'; then
            echo 'Sensitive Theo Core reference found. Installation aborted.'
            exit 1
          fi

      - name: Validate PHP
        run: find theme -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript
        run: |
          set -e
          for file in theme/assets/*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done

      - name: Commit clean deploy tree
        run: |
          rm -f torcisao-theme-sanitized.zip
          rm -f .github/workflows/install-theme-package.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'deploy: install sanitized Torcisao theme'
          git push
