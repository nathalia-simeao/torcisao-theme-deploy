name: Import sanitized theme

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-from-private.yml']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout deploy repository
        uses: actions/checkout@v4

      - name: Download sanitized artifact from source repository
        run: gh api repos/nathalia-simeao/torcisao-site/actions/artifacts/10069131257/zip > /tmp/torcisao-theme.zip

      - name: Replace theme directory
        run: |
          rm -rf theme
          mkdir -p theme
          unzip -q /tmp/torcisao-theme.zip -d theme
          rm -f theme/inc/torcisao-application-ai.php

      - name: Validate public package
        run: |
          test -f theme/style.css
          test -f theme/functions.php
          test -f theme/single.php
          test ! -f theme/inc/torcisao-application-ai.php
          if grep -RniE 'TORCISAO_HUBSPOT_ACCESS_TOKEN|TORCISAO_OPENAI_API_KEY|OPENAI_API_KEY|hubapi\.com/contacts|api\.openai\.com/v1/responses' theme --include='*.php' --include='*.js' --include='*.css'; then
            echo 'Sensitive Theo core reference found. Import aborted.'
            exit 1
          fi

      - name: Commit sanitized theme
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add theme
          git diff --cached --quiet && exit 0
          git commit -m 'deploy: import sanitized Torcisao theme'
          git push
